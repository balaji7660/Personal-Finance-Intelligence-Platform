version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./finsight.db
      - SECRET_KEY=your-production-secret-key-change-me
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - finsight_data:/app

  frontend:
    image: node:20-alpine
    container_name: finsight_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000/api
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  finsight_data:
